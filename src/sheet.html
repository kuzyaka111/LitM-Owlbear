<section class="mt-sheet mt-v4" aria-label="Лист персонажа">
  <div class="mt-toolbar">
  <nav class="mt-tabs" aria-label="Разделы листа" role="tablist">
    <button id="tab-party" role="tab" data-sheet-tab="party" aria-selected="true" aria-controls="panel-party">Персонаж и Братство</button>
    <button id="tab-themes" role="tab" data-sheet-tab="themes" aria-selected="false" aria-controls="panel-themes" tabindex="-1">Темы</button>
    <button id="tab-notes" role="tab" data-sheet-tab="notes" aria-selected="false" aria-controls="panel-notes" tabindex="-1">Заметки</button>
    <button type="button" class="mt-close-sheet" aria-label="Закрыть лист">×</button>
  </nav>
  <div class="mt-row-actions"><button type="button" class="mt-add-backpack">+ Хранилище</button><button type="button" class="mt-add-theme">+ Тема</button></div>
  </div>
  <div class="mt-stage">
    <div class="mt-main-cards">
      <section id="panel-party" role="tabpanel" aria-labelledby="tab-party">
        <div class="mt-card-row" tabindex="0" aria-label="Карточки персонажа и братства">
          <div class="mt-fellowship-host mt-card-slot"></div>
          <div class="mt-character-host mt-card-slot"></div>
          <div class="mt-inventory-host"></div>
        </div>
      </section>
      <section id="panel-themes" role="tabpanel" aria-labelledby="tab-themes" hidden><div class="mt-themes mt-card-row" tabindex="0" aria-label="Четыре темы персонажа"></div></section>
      <section id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" hidden><div class="mt-card-row mt-notes-cards" aria-label="Карточки заметок"></div></section>
    </div>
    <aside class="mt-action-card mt-theme" aria-label="Подсчёт Силы" hidden>
      <div class="mt-theme-head"><span>Подсчёт Силы</span><button type="button" class="mt-clear">Очистить</button></div>
      <div class="mt-action-total"><label>Сила Действия: <output class="mt-action-power-value" title="Сила для эффектов при успехе (минимум 1). При жертве эффекты определяет ведущий.">0</output></label><input class="mt-roll-modifier" type="number" step="1" value="0" min="-99" max="99" aria-label="Дополнительный модификатор броска" title="Дополнительный модификатор броска"><small>Бонус броска: <output class="mt-action-roll-value">0</output></small></div>
      <section class="mt-action-power"><h3>Теги силы</h3><div class="mt-action-list" data-kind="power"></div><form class="mt-add-action-tag" data-kind="power"><input maxlength="160" aria-label="Дополнительный тег силы" placeholder="Добавить тег"><button aria-label="Добавить силу">+</button></form></section>
      <section class="mt-action-weakness"><h3>Теги слабости</h3><div class="mt-action-list" data-kind="weakness"></div><form class="mt-add-action-tag" data-kind="weakness"><input maxlength="160" aria-label="Дополнительный тег слабости" placeholder="Добавить тег"><button aria-label="Добавить слабость">+</button></form></section>
      <div class="mt-improvements mt-special-actions">
        <button type="button" data-special="sacrifice" aria-pressed="false" title="Бросок без силы тегов. Уровень жертвы и последствия согласуются с ведущим."><span>◇</span>Пойти на Жертву</button>
        <button type="button" data-special="caution" aria-pressed="false" title="При исходной силе 2 или меньше: −1 к броску, +1 к силе эффектов. Только подробное действие."><span>◇</span>Отбросить осторожность</button>
        <button type="button" data-special="hedge" aria-pressed="false" title="При исходной силе 2 или больше: +1 к броску, −1 к силе эффектов. Только подробное действие."><span>◇</span>Подстраховаться</button>
      </div>
    </aside>
  </div>
  <div class="mt-ui-message" role="status" hidden></div>
</section>
