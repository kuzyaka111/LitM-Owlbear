<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Проверка отдельной вкладки</title><style>body{margin:0;background:#242733}iframe{border:0;width:100%;height:calc(100vh - 45px)}nav{height:45px;color:#fff;font:15px Georgia;padding:6px;box-sizing:border-box}button{margin-right:12px}</style><nav>Изолированная комната <button id="demote">Снять права GM</button><button id="disconnect">Закрыть комнату</button></nav><iframe id="host" src="./detached-host-preview.html" hidden></iframe><iframe id="controls" title="Панель"></iframe><script type="module">const host=document.querySelector('#host');host.addEventListener('load',()=>{document.querySelector('#controls').src='./detached-controls-preview.html?view='+(new URLSearchParams(location.search).get('view')||'gm');});document.querySelector('#demote').onclick=()=>host.contentWindow.postMessage({testRole:'PLAYER'},location.origin);document.querySelector('#disconnect').onclick=()=>host.remove();</script></html>
